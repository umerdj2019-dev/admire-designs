name: Restore ADMIRE website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract complete website
        run: |
          ARCHIVE="ADMIRE-DESIGNS-WHATSAPP-ORDER-FIX.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "Waiting for website ZIP."
            exit 0
          fi

          unzip -o "$ARCHIVE" -d .
          rm "$ARCHIVE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Restore complete ADMIRE website"
            git push
          fi
